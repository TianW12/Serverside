<!-- app/templates/admin/goods_received.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <title>Goods received</title>
</head>

<body>
    <header>
        <h1>Goods received</h1>

        <nav>
            <a href="/admin/">
                Dashboard
            </a>

            <a href="/admin/inventory">
                Inventory
            </a>
        </nav>
    </header>

    <main>
        <section class="panel">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Article</th>
                        <th>Quantity</th>
                        <th>Reference</th>
                    </tr>
                </thead>

                <tbody>
                    {% for receipt in goods_received %}
                        <tr>
                            <td>
                                {{ receipt.received_at }}
                            </td>

                            <td>
                                {{ receipt.article.name }}
                            </td>

                            <td>
                                {{ receipt.quantity }}
                            </td>

                            <td>
                                {{ receipt.reference or "" }}
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>
    </main>
</body>

</html>
